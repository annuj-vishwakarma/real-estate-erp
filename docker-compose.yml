# Local full stack: MongoDB single-node replica set + API + web (nginx).
#   docker compose up -d --build
# Demo data (development mode only; production refuses seed accounts):
#   NODE_ENV=development docker compose up -d --build
#   docker compose exec api node apps/api/dist/scripts/seed.js --reset
# Open http://localhost:8080
services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once PRIMARY.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: mongodb://mongo:27017/real_estate_erp?replicaSet=rs0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in your shell or .env}
      CORS_ORIGINS: http://localhost:8080
      APP_URL: http://localhost:8080
      # Plain http on localhost; always leave secure cookies on behind HTTPS.
      COOKIE_SECURE: 'false'
      TRUST_PROXY: '1'
      # Documents: local disk on a named volume. For production prefer STORAGE_DRIVER=s3 (see docs/deployment.md).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/.data/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes: ['uploads:/app/.data/uploads']
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    ports: ['8080:80']
    restart: unless-stopped

volumes:
  mongo-data:
  uploads:
